name: OpenTofu

on:
  workflow_call:
    inputs:
      needs-github-token:
        description: >-
          Fetch admin-github's org PAT from OpenBao and export it as
          GITHUB_TOKEN, for callers whose own Terraform uses the `github`
          provider (e.g. admin-github itself).
        type: boolean
        default: false
      needs-vault-root-token:
        description: >-
          Expose the caller's own VAULT_TOKEN secret to the job, for
          callers whose own Terraform manages OpenBao itself via the
          `vault` provider (e.g. admin-openbao). Requires the caller to
          pass `secrets: inherit`.
        type: boolean
        default: false
      tofu-version:
        type: string
        default: "1.12.0"

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: k8s-amd64
    env:
      VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
      VAULT_TOKEN: ${{ inputs.needs-vault-root-token && secrets.VAULT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout actions-tofu scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mattjmorrison-homelab/actions-tofu
          ref: ${{ github.workflow_sha }}
          path: .actions-tofu
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false
      - name: Format check
        run: tofu fmt -check -recursive
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - run: tflint --init
      - run: tflint
      - name: Fetch credentials from OpenBao
        run: bash .actions-tofu/scripts/fetch-credentials.sh
        env:
          NEEDS_GITHUB_TOKEN: ${{ inputs.needs-github-token }}
      - run: tofu init
      - run: tofu plan -out=tfplan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: k8s-amd64
    permissions:
      contents: read
      actions: read
    env:
      VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
      VAULT_TOKEN: ${{ inputs.needs-vault-root-token && secrets.VAULT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Checkout actions-tofu scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mattjmorrison-homelab/actions-tofu
          ref: ${{ github.workflow_sha }}
          path: .actions-tofu
      - name: Find the check run for this PR's merged commit
        id: find_run
        run: bash .actions-tofu/scripts/find-check-run.sh
        env:
          GH_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch credentials from OpenBao
        run: bash .actions-tofu/scripts/fetch-credentials.sh
        env:
          NEEDS_GITHUB_TOKEN: ${{ inputs.needs-github-token }}
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve tfplan
